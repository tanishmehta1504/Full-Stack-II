server.port=${PORT:8083}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:h2:file:./.data/socialflow;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=socialflow-publish-v1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=1500
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=2000
app.demo=${DEMO_MODE:true}
app.admin-password=${ADMIN_PASSWORD:Admin@12345}
app.jwt-secret=${JWT_SECRET:}
app.dispatch-ms=1000
app.retry-ms=1000
server.error.include-message=never
springdoc.swagger-ui.path=/swagger-ui.html
