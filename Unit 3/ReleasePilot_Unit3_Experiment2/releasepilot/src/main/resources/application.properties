spring.application.name=ReleasePilot
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8082}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./.data/releasepilot;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
server.error.include-message=never
app.version=${APP_VERSION:1.0.0-local}
app.track=${APP_TRACK:standalone}
app.commit=${APP_COMMIT:local}
app.fail-quotes=${APP_FAIL_QUOTES:false}
app.stable-url=${STABLE_URL:http://127.0.0.1:8083}
app.canary-url=${CANARY_URL:http://127.0.0.1:8084}
