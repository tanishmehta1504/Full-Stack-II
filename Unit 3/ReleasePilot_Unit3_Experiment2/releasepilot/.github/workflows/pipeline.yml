name: Build, verify, package and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: releasepilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit, MockMvc, Pact and real PostgreSQL tests
        run: mvn -B clean verify -Pdocker-tests
      - name: Record evidence and package the same source
        run: |
          python3 scripts/evidence.py
          mvn -B -DskipTests package
          cp target/releasepilot-1.0.0.jar releasepilot.jar
      - uses: actions/upload-artifact@v4
        with:
          name: verified-app
          path: releasepilot.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-and-pacts
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/pacts/
            src/main/resources/build-evidence.json
  canary-smoke:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-app
      - run: docker build -t releasepilot:local .
      - run: docker compose up -d --wait --wait-timeout 180
      - name: Verify routing, promotion and automatic rollback
        run: python3 scripts/canary_smoke.py --compose-fault
      - if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-smoke-logs
          path: compose.log
      - if: always()
        run: docker compose down -v
  image:
    needs: [verify, canary-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-app
      - id: name
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: COMMIT=${{ github.sha }}
          tags: ${{ steps.name.outputs.name }}:sha-${{ github.sha }}
      - id: reference
        env:
          IMAGE_NAME: ${{ steps.name.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_CD == 'true'
    runs-on: [self-hosted, linux, releasepilot-deploy]
    environment: lab
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy verified digest with canary gates
        env:
          RELEASE_IMAGE: ${{ needs.image.outputs.image }}
        run: python3 scripts/deploy.py "$RELEASE_IMAGE"
