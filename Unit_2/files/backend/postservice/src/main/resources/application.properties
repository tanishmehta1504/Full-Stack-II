spring.application.name=postservice
server.port=8080

# In-memory H2 database - resets every restart, zero setup required
spring.datasource.url=jdbc:h2:mem:postdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Frontend origins allowed to call this API (comma separated)
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173

# Correlation id shows up in every log line
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n
