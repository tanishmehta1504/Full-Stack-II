spring.application.name=SecureVault
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./.data/securevault;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
app.demo=${DEMO_MODE:true}
app.keys-dir=${KEYS_DIR:.secrets}
app.jwt-key=${JWT_KEY:}
app.aes-key=${AES_KEY:}
app.access-seconds=${ACCESS_SECONDS:300}
app.refresh-seconds=${REFRESH_SECONDS:604800}
app.secure-cookies=${SECURE_COOKIES:false}
logging.level.org.springframework.security=INFO
