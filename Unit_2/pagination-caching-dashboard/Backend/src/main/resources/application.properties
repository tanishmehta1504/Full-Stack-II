server.port=8080
spring.application.name=pagination-caching-dashboard

# ---------- H2 in-memory database (auto-created, no install needed) ----------
spring.datasource.url=jdbc:h2:mem:dashboarddb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Needed so we can COUNT real SQL statements executed (N+1 demo / benchmark endpoint)
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=off

# ---------- Caching (Ehcache via JCache / JSR-107) - Experiment 2.2.2 ----------
spring.cache.type=jcache
spring.cache.jcache.config=classpath:ehcache.xml
